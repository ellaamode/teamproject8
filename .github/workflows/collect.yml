# 매일 데이터 수집 (GitHub Actions, 무료). 레포지토리 최상위의 .github/workflows/ 에 있어야 동작합니다.
# Settings > Secrets and variables > Actions 에 등록:
#   DATABASE_URL_WRITER  batch_writer 계정의 Supabase 연결 주소
#   LAW_GO_KR_OC         국가법령정보 공동활용 Open API 인증키 (없으면 법령 수집은 건너뜀)
#   CRAWLER_CONTACT      원천 서버에 남길 연락처(팀 이메일)
name: collect
on:
  schedule:
    - cron: "0 21 * * *"     # 매일 06:00 KST (UTC 21:00)
  workflow_dispatch:
    inputs:
      stage:
        description: "실행할 단계"
        default: "all"
        type: choice
        options: [all, fetch, parse, link, derive]
      relink_all:
        description: "인용 규칙을 바꿨다면 체크 (모든 문서 재연결)"
        type: boolean
        default: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: service/backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_WRITER }}
      LAW_GO_KR_OC: ${{ secrets.LAW_GO_KR_OC }}
      CRAWLER_CONTACT: ${{ secrets.CRAWLER_CONTACT }}
      BACKFILL_LIMIT: "1500"          # 첫 적재는 하루 1,500건씩 나눠서 (약 40분)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: run pipeline
        run: |
          python -m batch.run ${{ github.event.inputs.stage || 'all' }} ${{ github.event.inputs.relink_all == 'true' && '--all' || '' }}
